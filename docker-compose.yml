# Para subir rodar: docker compose up -d
# Para recriar o banco de dados rodar: docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: manutencao
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/database:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: