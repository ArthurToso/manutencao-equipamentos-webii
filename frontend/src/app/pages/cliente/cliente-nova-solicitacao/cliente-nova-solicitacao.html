<div class="form-container">
  
  <header class="form-header">
    <h1>Nova Solicitação</h1>
    <p>Preencha os dados abaixo para registrar um novo equipamento.</p>
  </header>

  <form id="form-solicitacao" class="custom-form">
    <div class="form-group">
      <label for="equipamento">Descrição do equipamento</label>
      <input type="text" id="equipamento" name="equipamento" class="form-input" required>
    </div>

    <div class="form-group">
      <label for="categoria">Categoria do equipamento</label>
      <select id="categoria" name="categoria" class="form-input" required>
        <option value="" disabled selected>Selecione uma categoria...</option>
        <option value="Informática">Informática</option>
      </select>
    </div>

    <div class="form-group">
      <label for="defeito">Descrição do defeito</label>
      <textarea id="defeito" name="defeito" class="form-input form-textarea" required></textarea>
    </div>

    <div class="form-actions">
      <!-- Adicionei um botão de voltar/cancelar para melhorar a navegação -->
      <button type="button" class="btn btn--secondary" routerLink="/cliente/home">Cancelar</button>
      <button type="button" class="btn btn--primary">Registrar solicitação</button>
    </div>
  </form>

</div>
