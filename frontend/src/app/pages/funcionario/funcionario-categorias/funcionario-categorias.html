<div class="categories-board">

  <header class="categories-board__header">
    <div class="categories-board__title-group">
      <h1>Gerenciar Categorias</h1>
      <p>Cadastre e gerencie as categorias de equipamentos disponíveis.</p>
    </div>
    <div class="categories-board__actions-header">
      <button class="btn btn--primary" [routerLink]="['/funcionario/categorias/inserir']">Nova Categoria</button>
    </div>
  </header>

  @for (c of categorias; track c.id) {
    <div class="category-card">
      <div class="category-card__header">
        <span class="category-card__code">ID: {{ c.id }}</span>
      </div>

      <div class="category-card__body">
        <h3 class="category-card__title">{{ c.nome }}</h3>
      </div>

      <div class="category-card__actions">
        <button class="btn btn--primary" [routerLink]="['/funcionario/categorias/editar', c.id]">Editar</button>
        <button class="btn btn--danger-subtle" (click)="excluirCategoria(c.id)">Excluir</button>
      </div>
    </div>
  } @empty {
    <div class="empty-state">
      <p>Não há categorias cadastradas no momento.</p>
    </div>
  }

</div>
