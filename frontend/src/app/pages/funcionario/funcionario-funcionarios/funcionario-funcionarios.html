<div class="categories-board">

  <header class="categories-board__header">
    <div class="categories-board__title-group">
      <h1>Gerenciar Funcionários</h1>
      <p>Cadastre e gerencie os funcionarios da empresa.</p>
    </div>
    <div class="categories-board__actions-header">
      <button class="btn btn--primary" [routerLink]="['/funcionario/funcionarios/inserir']">Cadastrar Novo Funcionario</button>
    </div>
  </header>

  @for (f of funcionarios; track f.id) {
    <div class="category-card">
      <div class="category-card__header">
        <span class="category-card__code">ID: {{ f.id }}</span>
      </div>

      <div class="category-card__body">
        <h3 class="category-card__title">{{ f.nome }}</h3>
      </div>

      <div class="category-card__actions">
        <button class="btn btn--primary" [routerLink]="['/funcionario/funcionarios/editar', f.id]">Editar</button>
        <button class="btn btn--danger-subtle" (click)="excluirFuncionario(f.id)">Excluir</button>
      </div>
    </div>
  } @empty {
    <div class="empty-state">
      <p>Não há categorias cadastradas no momento.</p>
    </div>
  }

</div>
