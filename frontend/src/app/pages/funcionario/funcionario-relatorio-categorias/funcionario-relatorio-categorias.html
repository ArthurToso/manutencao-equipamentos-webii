<div class="container mt-4 mb-4" id="relatorio-container">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <h2>Relatório de Receitas por Categoria</h2>
        <button class="btn btn-primary" (click)="imprimirPDF()">Imprimir PDF</button>
    </div>

    <div class="relatorio-print-area mt-4">
        <div class="text-center mb-4 d-none d-print-block">
            <h2>Relatório de Receitas por Categoria</h2>
            <p>Todo o período</p>
        </div>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Categoria de Equipamento</th>
                    <th class="text-end">Receita (R$)</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of receitas">
                    <td>{{ item.categoria }}</td>
                    <td class="text-end">{{ item.receita | currency:'BRL':'symbol' }}</td>
                </tr>
                <tr *ngIf="receitas.length === 0">
                    <td colspan="2" class="text-center">Nenhuma receita encontrada.</td>
                </tr>
            </tbody>
            <tfoot *ngIf="receitas.length > 0">
                <tr class="table-secondary font-weight-bold">
                    <td><strong>Total</strong></td>
                    <td class="text-end"><strong>{{ totalReceita | currency:'BRL':'symbol' }}</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>
